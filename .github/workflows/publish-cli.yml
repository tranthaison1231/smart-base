name: Publish CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag and commit
        run: |
          node -e 'const version = require("./packages/create-smart-base/package.json").version; if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) { console.error("Tag must match the stable package version (vX.Y.Z)."); process.exit(1) }'
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @smart-base/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: npm publish --access public
        working-directory: packages/create-smart-base
